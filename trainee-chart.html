<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>แผนผังผู้ผ่านการอบรมบอนไซ (รุ่น 1, 2, 3) - สมาคมบอนไซไทย</title>
    <link rel="icon" type="image/png" href="logo.png" />

    <!-- Google Fonts: Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome 6 -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <!-- React 18 & ReactDOM 18 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

    <!-- Babel Standalone (for JSX in browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      var exports = {};
    </script>

    <style>
      body {
        font-family: 'Prompt', -apple-system, BlinkMacSystemFont, sans-serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.96); }
        to { opacity: 1; transform: scale(1); }
      }
      .animate-fadeIn {
        animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
    </style>
  </head>
  <body class="bg-white text-gray-800 antialiased selection:bg-emerald-200 selection:text-emerald-900">
    
    <!-- Top Global App Bar -->
    <nav id="top-nav" class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-xs transition-colors duration-300">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-2.5 text-gray-700 hover:text-emerald-800 transition">
          <img src="logo.png" alt="โลโก้สมาคมบอนไซไทย" class="w-8 h-8 object-contain" />
          <span class="font-bold text-sm sm:text-base text-emerald-950">สมาคมบอนไซไทย</span>
          <span class="text-xs bg-emerald-100 text-emerald-800 px-2 py-0.5 rounded-full font-semibold hidden sm:inline-block">
            Bangkok Training Program
          </span>
        </a>
        <div class="flex items-center gap-2">
          <a
            href="index.html"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-gray-100 hover:bg-emerald-50 text-gray-700 hover:text-emerald-800 text-xs sm:text-sm font-semibold transition"
          >
            <i class="fa-solid fa-arrow-left"></i> กลับสู่ระบบหลัก
          </a>
          <a
            href="index.html#manual"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-800 hover:bg-emerald-900 text-white text-xs sm:text-sm font-semibold transition shadow-xs"
          >
            <i class="fa-solid fa-book-open"></i> คู่มือ
          </a>
        </div>
      </div>
    </nav>

    <!-- React Root Mount Node -->
    <div id="root">
      <div class="min-h-screen flex items-center justify-center py-20 text-emerald-800 font-medium">
        <div class="flex items-center gap-3">
          <i class="fa-solid fa-circle-notch fa-spin text-2xl text-emerald-600"></i>
          <span>กำลังโหลดแผนผังผู้ผ่านการอบรมบอนไซ...</span>
        </div>
      </div>
    </div>

    <!-- Load and Render JSX -->
    <script type="text/babel" src="BonsaiTraineeChart.jsx"></script>
    <script type="text/babel">
      const Component = window.BonsaiTraineeChart || exports.default || BonsaiTraineeChart;
      const rootElement = document.getElementById('root');
      const root = ReactDOM.createRoot(rootElement);
      root.render(<Component />);
    </script>
  </body>
</html>
